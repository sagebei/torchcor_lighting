[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torchcor-lighting"
dynamic = ["version"]
description = "A desktop app for TorchCor: set up, run and explore GPU cardiac simulations without writing code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "TorchCor Lighting contributors" }]
keywords = ["cardiac", "simulation", "electrophysiology", "ecg", "mechanics", "gpu", "torchcor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=1.26",
    "paramiko>=3.4",
    "keyring>=25",
    "platformdirs>=4.2",
    "pydantic>=2.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.6"]

[project.scripts]
torchcor-lighting = "torchcor_studio.app:main"

[project.gui-scripts]
torchcor-lighting-gui = "torchcor_studio.app:main"

[tool.hatch.version]
path = "src/torchcor_studio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/torchcor_studio"]

[tool.hatch.build.targets.sdist]
include = ["src/torchcor_studio", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "slow: runs a real (small) TorchCor simulation on the CPU",
    "gui: needs a Qt application",
]
