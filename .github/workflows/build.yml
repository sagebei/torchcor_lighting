# Build the TorchCor Lighting desktop app on every platform, test it, and publish the
# installers. Runs on version tags (v1.2.3 -> GitHub Release) and on demand.
#
# Each job: install the app with its dependencies (never torch / torchcor -- simulations
# run in a separate Python on the compute machine), run the fast tests, then
# `python packaging/build.py --archive`, which freezes the app with PyInstaller,
# self-tests the frozen bundle and writes the installer + .sha256 into dist/.

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # Hosted Windows runners have no OpenGL 3.2 driver: skip the VTK render check.
            build-args: --no-render
          - name: macOS arm64
            os: macos-14
          - name: macOS x64
            # The last Intel image (macos-13 was retired in December 2025).
            os: macos-15-intel
          - name: Linux x86_64
            os: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/torchcor_studio/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = $version"
            exit 1
          fi

      - name: Install system libraries for Qt and VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgl1 libegl1 libopengl0 libglx-mesa0 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxrender1 libxi6 libxt6 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Install TorchCor Lighting (with dev tools and NVML telemetry)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,nvidia]"
          python -m pip list

      - name: Run the tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -m "not slow" -q
          else
            python -m pytest -m "not slow" -q
          fi

      - name: Build, self-test and package the app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python packaging/build.py --archive ${{ matrix.build-args }}
          else
            python packaging/build.py --archive ${{ matrix.build-args }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TorchCor-Lighting-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/TorchCor-Lighting-*.dmg
            dist/TorchCor-Lighting-*.zip
            dist/TorchCor-Lighting-*.tar.gz
            dist/TorchCor-Lighting-*.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: TorchCor-Lighting-*
          merge-multiple: true

      - name: List the release files
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.2.0-rc1, v1.2.0-beta ... are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
